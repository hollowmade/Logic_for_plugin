# ============================================================
#  LogicTierPlugin - Configuration
# ============================================================

database:
  type: sqlite          # sqlite | mysql
  file: tierplugin.db   # for sqlite only
  host: localhost
  port: 3306
  name: tierplugin
  user: root
  password: ""
  pool-size: 5

# ── Tier thresholds ─────────────────────────────────────────
# Each tier requires: min_elo, min_skill, min_confidence, min_fights
tiers:
  LT5:
    min_elo: 800
    min_skill: 0.0
    min_confidence: 0.20
    min_fights: 10
  HT5:
    min_elo: 950
    min_skill: 20.0
    min_confidence: 0.30
    min_fights: 20
  LT4:
    min_elo: 1050
    min_skill: 30.0
    min_confidence: 0.40
    min_fights: 30
  HT4:
    min_elo: 1150
    min_skill: 40.0
    min_confidence: 0.50
    min_fights: 40
  LT3:
    min_elo: 1250
    min_skill: 50.0
    min_confidence: 0.55
    min_fights: 50
  HT3:
    min_elo: 1380
    min_skill: 60.0
    min_confidence: 0.60
    min_fights: 60
  LT2:
    min_elo: 1520
    min_skill: 68.0
    min_confidence: 0.65
    min_fights: 80
  HT2:
    min_elo: 1670
    min_skill: 75.0
    min_confidence: 0.70
    min_fights: 100
  LT1:
    min_elo: 1830
    min_skill: 82.0
    min_confidence: 0.75
    min_fights: 130
  HT1:
    min_elo: 2000
    min_skill: 90.0
    min_confidence: 0.80
    min_fights: 160

# ── Elo / Glicko parameters ──────────────────────────────────
elo:
  initial_rating: 1000
  initial_rd: 350          # Rating Deviation (Glicko)
  initial_volatility: 0.06 # Glicko-2
  tau: 0.5                 # Glicko-2 system constant
  # Weights for PerformanceRating calculation
  weight_win_loss: 0.40
  weight_opponent_strength: 0.20
  weight_score_difference: 0.15
  weight_combat_performance: 0.15
  weight_mechanics: 0.10
  # Anti-abuse: diminishing returns for repeated opponents
  diminishing_returns:
    1: 1.00
    2: 0.70
    3: 0.50
    4: 0.30
    5: 0.10
  max_daily_rated_matches_per_opponent: 20


# ── Skill Score weights per gamemode (MVP: accuracy / damage / combo) ────────
# accuracy = hit% during fight
# damage   = total damage dealt, normalised to damage_cap
# combo    = max hit streak, normalised to combo_cap
skill_weights:
  damage_cap: 200   # damage score = min(100, dealt / damage_cap * 100)
  combo_cap:  20    # combo  score = min(100, maxCombo / combo_cap * 100)
  crystal:
    accuracy: 0.40
    damage:   0.35
    combo:    0.25
  sword:
    accuracy: 0.35
    damage:   0.35
    combo:    0.30
  cart:
    accuracy: 0.40
    damage:   0.30
    combo:    0.30

# ── Confidence parameters ────────────────────────────────────────────────────
confidence:
  provisional_threshold: 0.60   # below this → PROVISIONAL
  decay_rate_per_day: 0.005      # daily confidence decay when inactive

# ── Match quality cap ────────────────────────────────────────────────────────
match_rating:
  score_diff_cap: 15   # max kills difference used in quality calculation
