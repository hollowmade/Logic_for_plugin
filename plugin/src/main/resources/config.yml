# ============================================================
#  LogicTierPlugin - Configuration
# ============================================================

database:
  type: sqlite          # sqlite | mysql
  file: tierplugin.db   # for sqlite only
  host: localhost
  port: 3306
  name: tierplugin
  user: root
  password: ""
  pool-size: 5

# ── Tier thresholds ─────────────────────────────────────────
# Each tier requires: min_elo, min_skill, min_confidence, min_fights
# confidence grows from 0 (new player, RD 350) to 1 (RD at min_rd)
tiers:
  LT5:
    min_elo: 800
    min_skill: 0.0
    min_confidence: 0.20
    min_fights: 10
  HT5:
    min_elo: 950
    min_skill: 20.0
    min_confidence: 0.30
    min_fights: 20
  LT4:
    min_elo: 1050
    min_skill: 30.0
    min_confidence: 0.40
    min_fights: 30
  HT4:
    min_elo: 1150
    min_skill: 40.0
    min_confidence: 0.50
    min_fights: 40
  LT3:
    min_elo: 1250
    min_skill: 50.0
    min_confidence: 0.55
    min_fights: 50
  HT3:
    min_elo: 1380
    min_skill: 60.0
    min_confidence: 0.60
    min_fights: 60
  LT2:
    min_elo: 1520
    min_skill: 68.0
    min_confidence: 0.65
    min_fights: 80
  HT2:
    min_elo: 1670
    min_skill: 75.0
    min_confidence: 0.70
    min_fights: 100
  LT1:
    min_elo: 1830
    min_skill: 82.0
    min_confidence: 0.75
    min_fights: 130
  HT1:
    min_elo: 2000
    min_skill: 90.0
    min_confidence: 0.80
    min_fights: 160

# ── Elo parameters ───────────────────────────────────────────
# Every gamemode (sword / crystal / cart) has its own independent rating.
elo:
  initial_rating: 1000
  initial_rd: 350           # rating deviation of a new player (uncertain → big Elo swings)
  min_rd: 60                # RD floor = fully established player
  rd_decay_per_match: 0.97  # RD *= this after every rated match
  initial_volatility: 0.06  # reserved for Glicko-2
  # Anti-abuse: Elo weight of the 1st, 2nd, 3rd... match vs the same opponent today
  # (per gamemode). The last value applies to every further match.
  diminishing_returns:
    1: 1.00
    2: 0.70
    3: 0.50
    4: 0.30
    5: 0.10
  # Beyond this many matches per pair per day the match is stored but unrated
  max_daily_rated_matches_per_opponent: 20

# ── Tier rules ───────────────────────────────────────────────
tier_rules:
  placement_fights: 10      # until then the tier is a temporary estimate (provisional)
  demotion_buffer_elo: 30   # a fixed tier is kept until Elo drops this far below its min_elo

# ── Skill Score weights per gamemode (MVP: accuracy / damage / combo) ────────
# accuracy = hit% during fight
# damage   = total damage dealt, normalised to damage_cap
# combo    = max hit streak, normalised to combo_cap
skill_weights:
  damage_cap: 200   # damage score = min(100, dealt / damage_cap * 100)
  combo_cap:  20    # combo  score = min(100, maxCombo / combo_cap * 100)
  ema_alpha:  0.2   # weight of the newest fight in the running skill score
  crystal:
    accuracy: 0.40
    damage:   0.35
    combo:    0.25
  sword:
    accuracy: 0.35
    damage:   0.35
    combo:    0.30
  cart:
    accuracy: 0.40
    damage:   0.30
    combo:    0.30

# ── Combat metrics tracker ───────────────────────────────────────────────────
metrics:
  combo_timeout_ms: 1500   # a hit streak breaks if the next hit comes later than this
  combo_min_length: 2      # shortest streak counted as a combo (for avg / median)
  summary_fights: 20       # /tieradmin metrics aggregates this many recent fights

# ── Match quality cap ────────────────────────────────────────────────────────
match_rating:
  score_diff_cap: 15   # max kills difference used in quality calculation
