name: LogicTierPlugin
version: 1.0.0-SNAPSHOT
main: ru.logic.tierplugin.LogicTierPlugin
api-version: '1.21'
description: Автоматическая выдача PvP-тиров LT5–HT1 по рейтингу Elo и метрикам боя
authors: [Logic]

commands:
  tier:
    description: Профиль игрока — тир, рейтинг и статистика
    usage: /tier [игрок]
    permission: tierplugin.tier
  tieradmin:
    description: Управление тирами для администраторов
    usage: /tieradmin <fight|metrics|info|set|reset|simulate|stats|debug>
    permission: tierplugin.admin
  duel:
    description: Дуэли (в разработке)
    usage: /duel <request|accept|decline> [игрок]
    permission: tierplugin.duel

permissions:
  tierplugin.tier:
    description: Смотреть профили и тиры
    default: true
  tierplugin.duel:
    description: Вызывать на дуэль
    default: true
  tierplugin.admin:
    description: Команды администратора
    default: op
